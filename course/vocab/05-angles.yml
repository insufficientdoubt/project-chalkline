unit: 5
unit_title: Angles
terms:
- term: angle
  definition: Two lines that start at the same point make an angle.
  example: The two hands of a clock make an angle.
  notes: An angle has one vertex and two sides. The size of an angle is how wide its two sides open. It does not depend on how long the sides are.
  zh: 角
  image: MTH-001.svg
  id: MTH-001
- term: vertex
  definition: The point where the two sides of an angle meet.
  example: Put the center of the protractor on the vertex.
  notes: Every angle has one vertex. When an angle turns, it turns around its vertex. More than one vertex are called vertices.
  zh: 顶点
  image: MTH-002.svg
  id: MTH-002
- term: side
  definition: One of the two straight lines that make an angle.
  example: Line up one side with the 0 line.
  notes: An angle has two sides. They start at the vertex. Making the sides longer does not make the angle bigger.
  zh: 边
  image: MTH-003.svg
  id: MTH-003
- term: ray
  definition: A straight line with a start point that goes on forever one way.
  example: A ray of sunlight starts at the sun.
  notes: A ray has one end point. The two sides of an angle are rays that start at the vertex.
  zh: 射线
  image: MTH-004.svg
  id: MTH-004
- term: rotate
  definition: To turn around a center point.
  example: Rotate one side and watch the angle grow.
  notes: When one side of an angle rotates around the vertex, the angle gets bigger or smaller. The hands of a clock rotate too.
  zh: 旋转
  image: MTH-005.svg
  id: MTH-005
- term: degree
  definition: The unit we use to measure the size of an angle.
  example: A right angle is 90 degrees.
  notes: 'We write degrees with a small circle: 90° means 90 degrees. A right angle is 90°. A full turn is 360°.'
  zh: 度
  image: MTH-006.svg
  id: MTH-006
- term: acute angle
  definition: An angle smaller than a right angle.
  example: The tip of a pizza slice is an acute angle.
  notes: An acute angle is more than 0° and less than 90°. Its sides are close together.
  zh: 锐角
  image: MTH-007.svg
  id: MTH-007
- term: right angle
  definition: 'An angle like the corner of a square: 90°.'
  example: The corner of a book is a right angle.
  notes: A right angle is exactly 90°. We mark it with a small square at the vertex. Books, doors and windows have right angles.
  zh: 直角
  image: MTH-008.svg
  id: MTH-008
- term: obtuse angle
  definition: An angle bigger than a right angle but smaller than a straight angle.
  example: At 4:00, the clock hands make an obtuse angle.
  notes: An obtuse angle is more than 90° and less than 180°. Its sides open wide.
  zh: 钝角
  image: MTH-009.svg
  id: MTH-009
- term: straight angle
  definition: 'An angle whose two sides make a straight line: 180°.'
  example: At 6:00, the clock hands make a straight angle.
  notes: 'Turn one side of an angle until the two sides make a straight line. That is a straight angle. It is still an angle: it has a vertex. 1 straight angle = 2 right angles.'
  zh: 平角
  image: MTH-010.svg
  id: MTH-010
- term: full angle
  definition: 'One side turns all the way around, back to the start: 360°.'
  example: In one hour, the minute hand turns a full angle.
  notes: Keep turning one side of an angle until it comes back to the other side. That is a full angle. 1 full angle = 2 straight angles = 4 right angles.
  zh: 周角
  image: MTH-011.svg
  id: MTH-011
- term: protractor
  definition: A tool for measuring angles in degrees.
  example: Use a protractor to measure the angle.
  notes: A protractor is usually a half circle with marks from 0° to 180°. Most have two scales, one inside and one outside. Read the scale that starts at 0 on your angle's side.
  zh: 量角器
  image: MTH-012.jpg
  id: MTH-012
- term: clock face
  definition: The front of a clock, with the numbers and the hands.
  example: Look at the clock face and name the angle.
  notes: A clock face has 12 numbers. From one number to the next is 30°, because 360° ÷ 12 = 30°.
  zh: 钟面
  image: MTH-013.jpg
  id: MTH-013
- term: hour hand
  definition: The short hand on a clock. It shows the hour.
  example: At 3:00, the hour hand points to 3.
  notes: The hour hand turns slowly. It goes all the way around the clock face in 12 hours.
  zh: 时针
  image: MTH-014.svg
  id: MTH-014
- term: minute hand
  definition: The long hand on a clock. It shows the minutes.
  example: At 3:00, the minute hand points to 12.
  notes: The minute hand goes all the way around the clock face in one hour. That is a full turn, 360°.
  zh: 分针
  image: MTH-015.svg
  id: MTH-015
