# Column definitions and allowed values for data/*.csv.
# `python chalkline.py validate` reads this file. Change allowed values here, not in the script.
# Domains are the ID prefix: GRC = Ancient Greece, ROM = Ancient Rome, GBT = Göbekli Tepe, MTH = Math. Add your own the same way
# (and give them names in config.js).

levels: [1, 2, 3]          # 1 = everyone, 2 = going further, 3 = expert
statuses: [draft, reviewed, verified]
list_separator: ";"

vocab:
  file: data/vocab.csv
  id_pattern: "^(GRC|ROM|GBT|MTH)-\\d{3}$"
  columns:
    - {name: id,            required: true}
    - {name: term_en,       required: true}
    - {name: aka}
    - {name: zh,            required_when_status: [verified]}
    - {name: short_def,     required: true, max_length: 75}
    - {name: explanation}
    - {name: example,       warn_if_missing_when_status: [verified]}
    - {name: confused_with, list: true, refs: vocab}
    - {name: domain,        required: true}
    - {name: subdomain,     required: true}
    - {name: tags,          list: true}
    - {name: level,         required: true}
    - {name: image,         file_in: images}
    - {name: ref_url,       pattern: "^https://"}  # one 'learn more' link
    - {name: status,        required: true}

  domains:
    GRC: [geography, government, culture]
    ROM: [government, army, daily-life, engineering]
    GBT: [archaeology, daily-life, building, culture]
    MTH: [angles, measuring]

frames:
  # Language points beyond vocabulary: one row each. kind says what it is (and how {{< frames >}} shows it):
  #   grammar   a pattern (short adjective + -er + than), with examples
  #   phrase    words that go together (a quarter turn)
  #   stem      a sentence starter, finished by the student (Today I learned …)
  #   frame     a whole sentence with ___ gaps (A ___ angle is ___ than a right angle.)
  #   question  a question format to practise (Can you give an example of ___?), not a content question to
  #             memorise: its answer frames in answer_en / answer_zh (several: separate them with ;), and in
  #             example one worked use, as a model ("Q → A")
  # units: the unit numbers that use it (2; 5), or empty for all year.
  file: data/frames.csv
  id_pattern: "^FRM-\\d{3}$"
  columns:
    - {name: id,        required: true}
    - {name: kind,      required: true, allowed: [grammar, phrase, stem, frame, question]}
    - {name: en,        required: true}
    - {name: zh,        required_when_status: [verified]}
    - {name: answer_en}
    - {name: answer_zh}
    - {name: example}
    - {name: function,  required: true, allowed: [start, agree, disagree, add, ask, clarify, compare, describe, explain, opinion, sequence, cause, summarise]}
    - {name: units,     pattern: "^\\d+(\\s*;\\s*\\d+)*$"}
    - {name: status,    required: true}
