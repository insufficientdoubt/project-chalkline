<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" font-family="Arial, Helvetica, sans-serif">
  <!-- the classroom -->
  <rect x="20" y="20" width="560" height="320" rx="10" fill="#fff" stroke="#003477" stroke-width="6"/>
  <!-- board on the top wall, windows on the left wall -->
  <line x1="220" y1="20" x2="380" y2="20" stroke="#0087ff" stroke-width="12" stroke-linecap="round"/>
  <text x="300" y="46" text-anchor="middle" font-size="16" font-weight="700" fill="#0087ff">Board</text>
  <g stroke="#9fd3f5" stroke-width="10"><line x1="20" y1="120" x2="20" y2="170"/><line x1="20" y1="210" x2="20" y2="260"/></g>
  <!-- the door (bottom right) and the hallway outside -->
  <line x1="420" y1="340" x2="490" y2="340" stroke="#fff" stroke-width="10"/>
  <path d="M420 340 A70 70 0 0 1 490 270" fill="none" stroke="#003477" stroke-width="2.5" stroke-dasharray="5 5"/>
  <line x1="420" y1="340" x2="420" y2="270" stroke="#003477" stroke-width="4"/>
  <rect x="20" y="362" width="560" height="74" rx="10" fill="#ebf7fd"/>
  <text x="40" y="406" font-size="17" font-weight="700" fill="#5b6b80">Hallway</text>
  <!-- teacher's desk -->
  <rect x="440" y="62" width="90" height="40" rx="6" fill="#d5deeb" stroke="#003477" stroke-width="3"/>
  <text x="485" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#003477">Teacher</text>
  <!-- desk clusters: four desks each -->
  <g fill="#f2f6fa" stroke="#7b8794" stroke-width="2.5">
    <g transform="translate(130 120)"><rect width="44" height="30" rx="4"/><rect x="48" width="44" height="30" rx="4"/><rect y="34" width="44" height="30" rx="4"/><rect x="48" y="34" width="44" height="30" rx="4"/></g>
    <g transform="translate(130 230)"><rect width="44" height="30" rx="4"/><rect x="48" width="44" height="30" rx="4"/><rect y="34" width="44" height="30" rx="4"/><rect x="48" y="34" width="44" height="30" rx="4"/></g>
    <g transform="translate(300 230)"><rect width="44" height="30" rx="4"/><rect x="48" width="44" height="30" rx="4"/><rect y="34" width="44" height="30" rx="4"/><rect x="48" y="34" width="44" height="30" rx="4"/></g>
  </g>
  <!-- station 3: a desk cluster -->
  <g transform="translate(300 120)"><rect x="-8" y="-8" width="108" height="80" rx="10" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-width="3"/>
    <g fill="#fff" stroke="#14b8a6" stroke-width="2.5"><rect width="44" height="30" rx="4"/><rect x="48" width="44" height="30" rx="4"/><rect y="34" width="44" height="30" rx="4"/><rect x="48" y="34" width="44" height="30" rx="4"/></g></g>
  <!-- station markers -->
  <g font-weight="800" text-anchor="middle">
    <circle cx="66" cy="66" r="30" fill="#0087ff"/><text x="66" y="76" font-size="30" fill="#fff">1</text>
    <circle cx="534" cy="294" r="30" fill="#ff8c0f"/><text x="534" y="304" font-size="30" fill="#10233f">2</text>
    <circle cx="346" cy="152" r="26" fill="#14b8a6"/><text x="346" y="162" font-size="28" fill="#fff">3</text>
    <circle cx="455" cy="400" r="30" fill="#7a5af8"/><text x="455" y="410" font-size="30" fill="#fff">4</text>
  </g>
  <g font-size="15" font-weight="700" fill="#10233f">
    <text x="104" y="60">Clock</text>
    <text x="496" y="250" text-anchor="end">Draw</text>
    <text x="346" y="104" text-anchor="middle">Hunt</text>
    <text x="495" y="406">Talk</text>
  </g>
</svg>
