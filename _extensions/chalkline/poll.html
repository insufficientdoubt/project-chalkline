<!--
  Tap-to-vote polls for reveal.js slides. No server, no student devices:
  students tap the buttons on the board (or you click them while counting hands).

  Included in every slide deck by _quarto.yml. Write a poll on any slide:

      ::: {.poll type="smileys"}
      How confident do you feel?
      :::

      ::: {.poll type="choice" options="Athens | Sparta | Corinth" correct="B"}
      Which city-state trained every boy to be a soldier?
      :::

      ::: {.poll type="truefalse" correct="false"}
      Athens had a king.
      :::

  Options:
    type      smileys, choice or truefalse
    options   choice only: answers separated by |  (up to 6)
    correct   optional: the right answer (a letter like B, or true/false), highlighted on reveal
    cooldown  optional: seconds between taps (default 1), so one student can't vote 10 times fast

  Results summary: put this on its own slide (usually the last one) to show every
  poll in the deck on one page, ready to screenshot:

      ## Poll results {.poll-summary-slide}

      ::: {.poll-summary}
      :::

  Star survey: a few "I can" lines, each rated 1 to 4 stars by tapping. When a student has rated every
  line, it beeps, says thank you and fades back to empty for the next student. Show results graphs them.

      ::: {.star-survey stars="4"}
      - [name five kinds of angle | 说出五种角的名称]{.bi}
      - [find angles around me | 找到身边的角]{.bi}
      :::

  On a poll slide:  R = show/hide results   1–6 = add a vote   (or use the buttons)
  Votes are saved in this browser, so they survive changing slides or a refresh.
-->
<style>
  .poll {
    --poll-navy: #003477;
    --poll-paper: #ebf7fd;
    text-align: center;
  }
  .poll .poll-q { font-size: 1.05em; margin: 0.2em 0 0.6em; }
  .poll .poll-q p { margin: 0; }

  .poll .poll-buttons {
    display: flex;
    justify-content: center;
    gap: 1.4em;
    flex-wrap: wrap;
    margin: 0.7em 0 1em;
  }
  .poll .poll-btn {
    all: unset;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25em;
    width: 6.4em;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .poll .poll-face {
    width: 4.8em;
    height: 4.8em;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--c);
    color: var(--t, #fff);
    font-weight: 700;
    font-size: 1em;
    box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
    transition: transform 0.12s, box-shadow 0.12s, filter 0.2s;
  }
  .poll .poll-face svg { width: 62%; height: 62%; }
  .poll .poll-face .poll-letter { font-size: 2.1em; line-height: 1; }
  .poll .poll-btn:hover .poll-face { transform: translateY(-3px); }
  .poll .poll-btn:active .poll-face,
  .poll .poll-btn.pop .poll-face { transform: translateY(4px) scale(0.94); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15); }
  .poll .poll-label { font-size: 0.62em; font-weight: 600; line-height: 1.2; color: #333; max-width: 10em; }
  .poll.cooling .poll-face { filter: grayscale(0.6) opacity(0.55); }

  /* True/false and smileys: cards, each with a badge drawn in inline SVG and its word inside the card */
  .poll.poll-cards .poll-buttons { gap: 1.6em; }
  .poll.poll-cards .poll-btn {
    width: 6.8em;
    padding: 0.55em 0.4em 0.45em;
    gap: 0.2em;
    border-radius: 0.55em;
    background: #fff;
    border: 3px solid var(--c);
    box-shadow: 0 0.28em 0 color-mix(in srgb, var(--c) 65%, #003477), 0 0.6em 1.2em rgba(0, 52, 119, 0.12);
    transition: transform 0.12s, box-shadow 0.12s, filter 0.2s;
  }
  .poll.poll-cards .poll-btn:hover { transform: translateY(-3px); box-shadow: 0 0.4em 0 color-mix(in srgb, var(--c) 65%, #003477), 0 0.8em 1.4em rgba(0, 52, 119, 0.16); }
  .poll.poll-cards .poll-btn:active,
  .poll.poll-cards .poll-btn.pop { transform: translateY(0.2em); box-shadow: 0 0.08em 0 color-mix(in srgb, var(--c) 65%, #003477); }
  .poll.poll-cards .poll-btn:focus-visible { outline: 3px solid var(--poll-navy); outline-offset: 4px; }
  .poll .poll-badge { display: block; width: 3.6em; height: 3.6em; }
  .poll .poll-badge svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .poll.poll-cards .poll-label { font-size: 0.82em; font-weight: 800; letter-spacing: 0.02em; color: var(--poll-navy); max-width: none; }
  .poll.poll-cards.cooling .poll-btn { filter: grayscale(0.6) opacity(0.55); cursor: default; }
  .poll.cooling .poll-btn { cursor: default; }

  /* Multiple choice, words: each answer big on its own coloured tile */
  .poll.poll-big .poll-buttons { gap: 1em; }
  .poll.poll-big .poll-btn { width: auto; }
  .poll.poll-big .poll-face {
    width: auto; min-width: 3.4em; height: auto; min-height: 3em; padding: 0.15em 0.55em; border-radius: 0.4em;
  }
  .poll.poll-big .poll-answer { font-size: 2.4em; font-weight: 800; line-height: 1.05; }
  .poll.poll-big .poll-btn[data-long="1"] .poll-answer { font-size: 1.5em; }
  .poll.poll-big .poll-btn[data-long="2"] .poll-answer { font-size: 1em; max-width: 9em; }
  .poll.poll-big .poll-row .poll-face { width: 1em; height: 1em; }
  /* Multiple choice, pictures: picture cards, each with its letter */
  .poll.poll-pics .poll-buttons { gap: 1.1em; }
  .poll.poll-pics .poll-btn {
    width: 7em; padding: 0.3em 0.3em 0.35em; gap: 0.25em; border-radius: 0.5em; background: #fff; border: 3px solid var(--c);
    box-shadow: 0 0.25em 0 color-mix(in srgb, var(--c) 65%, #003477), 0 0.5em 1em rgba(0, 52, 119, 0.12); transition: transform 0.12s, box-shadow 0.12s, filter 0.2s;
  }
  .poll.poll-pics .poll-btn:hover { transform: translateY(-3px); }
  .poll.poll-pics .poll-btn:active, .poll.poll-pics .poll-btn.pop { transform: translateY(0.15em); box-shadow: 0 0.08em 0 color-mix(in srgb, var(--c) 65%, #003477); }
  .poll.poll-pics .poll-pic { display: block; width: 100%; height: 5em; margin: 0; object-fit: contain; border-radius: 0.3em; background: #fff; }
  .poll.poll-pics .poll-tag {
    position: absolute; top: -0.55em; left: -0.55em; z-index: 1; width: 1.5em; height: 1.5em; border-radius: 50%; display: grid; place-items: center;
    background: var(--c); color: var(--t); font-weight: 800; font-size: 0.85em; box-shadow: 0 2px 6px rgba(0, 20, 60, 0.25);
  }
  .poll.poll-pics .poll-label { font-size: 0.6em; font-weight: 800; color: var(--poll-navy); }
  .poll.poll-pics.cooling .poll-btn { filter: grayscale(0.6) opacity(0.55); }
  .poll .poll-row-pic { display: none; }
  .poll.poll-pics .poll-row { grid-template-columns: 1.7em 2.2em 7em 1fr 6em; }
  .poll.poll-pics .poll-row-pic { display: block; width: 2.2em; height: 1.7em; margin: 0; object-fit: contain; }
  .poll-summary .poll-sum-label img { height: 1.2em; margin: 0; vertical-align: middle; }

  .poll .poll-plus {
    position: absolute;
    top: -0.2em;
    font-size: 0.6em;
    font-weight: 700;
    color: var(--c);
    pointer-events: none;
    animation: poll-float 0.8s ease-out forwards;
  }
  @keyframes poll-float { to { transform: translateY(-1.6em); opacity: 0; } }

  .poll .poll-results { display: none; max-width: 92%; margin: 0.6em auto 0.9em; text-align: left; }
  .poll.revealed .poll-results { display: block; }
  .poll.revealed .poll-buttons { display: none; }
  .poll .poll-row {
    display: grid;
    grid-template-columns: 1.7em 9em 1fr 6em;
    align-items: center;
    gap: 0.6em;
    margin: 0.5em 0;
    font-size: 0.8em;
  }
  .poll .poll-row .poll-face { width: 1.7em; height: 1.7em; font-size: 1em; box-shadow: none; }
  .poll .poll-row-label { font-weight: 600; color: #222; line-height: 1.15; }
  .poll .poll-row .poll-face .poll-letter { font-size: 0.9em; }
  .poll .poll-track {
    position: relative;
    height: 1.7em;
    background: rgba(0, 0, 0, 0.06);
    border-radius: 0.85em;
    overflow: hidden;
  }
  .poll .poll-bar {
    height: 100%;
    width: 0;
    background: var(--c);
    border-radius: 0.75em;
    transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .poll .poll-num { font-weight: 700; color: var(--poll-navy); text-align: right; white-space: nowrap; }
  .poll .poll-row.correct .poll-track { outline: 3px solid var(--poll-navy); outline-offset: 2px; }
  .poll .poll-row.correct .poll-num::after { content: " ✓"; color: var(--poll-navy); }
  .poll.has-correct .poll-row:not(.correct) { opacity: 0.6; }

  .poll .poll-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.6em;
    font-size: 0.55em;
    color: #555;
  }
  .poll .poll-controls button {
    font: inherit;
    font-weight: 600;
    padding: 0.35em 1em;
    border-radius: 999px;
    border: 2px solid var(--poll-navy);
    background: #fff;
    color: var(--poll-navy);
    cursor: pointer;
  }
  .poll .poll-controls .poll-show { background: var(--poll-navy); color: #fff; }
  .poll .poll-total { min-width: 5.5em; }

  /* Results summary slide */
  .reveal .poll-summary-slide h2 { margin-bottom: 0.2em; }
  .poll-summary { font-size: 0.62em; text-align: left; }
  .poll-summary .poll-sum-head {
    display: flex;
    justify-content: space-between;
    color: #555;
    margin-bottom: 0.6em;
  }
  .poll-summary .poll-sum-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(15em, 1fr));
    gap: 0.8em;
  }
  /* Star survey */
  .star-survey { --ss-gold: #fbc400; --ss-navy: #003477; position: relative; }
  .star-survey > ul { display: none; }
  .star-survey .ss-form { display: flex; flex-direction: column; gap: 0.35em; transition: opacity 0.5s, transform 0.5s; }
  .star-survey .ss-form.ss-fade { opacity: 0; transform: translateY(0.4em); }
  .star-survey .ss-row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1em;
    padding: 0.3em 0.4em 0.3em 0.8em; border-radius: 0.5em; background: var(--surface-2, #f4f8fc);
    border: 1px solid var(--line, rgba(0, 52, 119, 0.15));
  }
  .star-survey .ss-row.ss-done { border-color: var(--ss-gold); background: color-mix(in srgb, var(--ss-gold) 10%, var(--surface-2, #fff)); }
  .star-survey .ss-label { font-size: 0.85em; line-height: 1.2; }
  .star-survey .ss-label p { margin: 0; }
  .star-survey .ss-stars { display: flex; gap: 0.15em; }
  .star-survey .ss-star { all: unset; cursor: pointer; width: 1.9em; height: 1.9em; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
  .star-survey .ss-star svg { width: 100%; height: 100%; overflow: visible; transition: transform 0.12s; }
  .star-survey .ss-star .ss-fill { fill: #fff; stroke: #b9c4d2; stroke-width: 3; stroke-linejoin: round; transition: fill 0.15s, stroke 0.15s; }
  .star-survey .ss-star.ss-on .ss-fill { fill: var(--ss-gold); stroke: #d99a00; }
  .star-survey .ss-star:hover svg { transform: scale(1.12); }
  .star-survey .ss-star:active svg { transform: scale(0.9); }
  .star-survey .ss-star:focus-visible { outline: 3px solid #0087ff; outline-offset: 2px; border-radius: 50%; }
  .star-survey .ss-thanks {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    font-size: 1.4em; font-weight: 800; color: var(--ss-navy);
  }
  .star-survey .ss-thanks.ss-show { opacity: 1; }
  .star-survey .ss-controls { display: flex; justify-content: center; align-items: center; gap: 0.6em; margin-top: 0.5em; font-size: 0.5em; color: #555; }
  .star-survey .ss-controls button {
    font: inherit; font-weight: 600; padding: 0.35em 1em; border-radius: 2em; cursor: pointer;
    border: 2px solid var(--ss-navy); background: #fff; color: var(--ss-navy);
  }
  .star-survey .ss-controls .ss-show-btn { background: var(--ss-navy); color: #fff; }
  .star-survey .ss-results { display: none; flex-direction: column; gap: 0.45em; }
  .star-survey.ss-revealed .ss-results { display: flex; }
  .star-survey.ss-revealed .ss-form { display: none; }
  .star-survey .ss-res-row { display: grid; grid-template-columns: 1fr 50% 3.6em; align-items: center; gap: 0.7em; font-size: 0.75em; }
  .star-survey .ss-res-label { line-height: 1.2; }
  .star-survey .ss-res-label p { margin: 0; }
  .star-survey .ss-bars { display: flex; height: 1.5em; border-radius: 0.4em; overflow: hidden; background: rgba(0, 0, 0, 0.06); }
  .star-survey .ss-seg {
    display: grid; place-items: center; min-width: 0; color: #10233f; font-size: 0.7em; font-weight: 700;
    transition: flex-grow 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .star-survey .ss-avg { font-weight: 800; color: var(--ss-navy); text-align: right; white-space: nowrap; }
  .star-survey .ss-key { display: flex; justify-content: center; gap: 1em; font-size: 0.5em; color: #555; }
  .star-survey .ss-key span::before { content: ""; display: inline-block; width: 0.9em; height: 0.9em; border-radius: 0.2em; margin-right: 0.3em; vertical-align: -0.1em; background: var(--c); }

  .poll-summary .poll-sum-card {
    background: #ebf7fd;
    border-radius: 0.8em;
    padding: 0.7em 0.9em;
    border-top: 0.35em solid #0087ff;
  }
  .poll-summary .poll-sum-title {
    font-size: 0.75em;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #003477;
  }
  .poll-summary .poll-sum-q { font-weight: 600; line-height: 1.25; margin: 0.25em 0 0.5em; min-height: 2.5em; }
  .poll-summary .poll-sum-q p { margin: 0; }
  .poll-summary .poll-sum-row {
    display: grid;
    grid-template-columns: 6.5em 1fr 4.6em;
    align-items: center;
    gap: 0.4em;
    margin: 0.3em 0;
    font-size: 0.85em;
  }
  .poll-summary .poll-sum-label { line-height: 1.1; }
  .poll-summary .poll-sum-row.correct .poll-sum-label { font-weight: 700; color: #003477; }
  .poll-summary .poll-sum-track { height: 0.9em; background: rgba(0, 0, 0, 0.07); border-radius: 0.45em; overflow: hidden; }
  .poll-summary .poll-sum-bar { display: block; height: 100%; background: var(--c); border-radius: 0.45em; }
  .poll-summary .poll-sum-num { text-align: right; font-weight: 700; color: #003477; white-space: nowrap; }
  .poll-summary .poll-sum-total { margin-top: 0.4em; font-size: 0.8em; color: #666; text-align: right; }
</style>

<script>
(function () {
  const polls = document.querySelectorAll(".poll");
  if (!polls.length && !document.querySelector(".star-survey")) return;
  const isPreview = /[?&]receiver/.test(window.location.search);  // speaker-view thumbnails

  // Brand colors, each with a readable text color (navy on light fills, white on dark).
  const NAVY = "#003477";
  const COLORS = [
    { c: "#0087ff", t: "#fff" },   // blue
    { c: "#ff8c0f", t: NAVY },     // orange
    { c: "#14d7cd", t: NAVY },     // turquoise
    { c: NAVY, t: "#fff" },        // navy
    { c: "#fbc400", t: NAVY },     // yellow (extra)
    { c: "#0abee6", t: NAVY },     // cyan (extra)
  ];
  const FACE = {
    happy: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="13" cy="15" r="1.5" fill="currentColor"/><circle cx="27" cy="15" r="1.5" fill="currentColor"/><path d="M11 24c4 5 14 5 18 0"/></svg>',
    meh: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="13" cy="15" r="1.5" fill="currentColor"/><circle cx="27" cy="15" r="1.5" fill="currentColor"/><path d="M12 26h16"/></svg>',
    sad: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="13" cy="15" r="1.5" fill="currentColor"/><circle cx="27" cy="15" r="1.5" fill="currentColor"/><path d="M11 29c4-5 14-5 18 0"/></svg>',
    check: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 21l7 7 13-15"/></svg>',
    cross: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M12 12l16 16M28 12L12 28"/></svg>',
  };
  // The true/false buttons' badges: the button's colour (--c), a soft shine on top, an inner ring,
  // and a white mark with a navy shadow under it. No ids, so any number of polls can share a page.
  function badge(mark, eyes) {
    return '<svg viewBox="0 0 80 80" aria-hidden="true">' +
      '<circle cx="40" cy="43" r="35" fill="#003477" opacity="0.18"/>' +
      '<circle cx="40" cy="40" r="35" style="fill: var(--c)"/>' +
      '<path d="M9 36a31 31 0 0 1 62 0c-9-7-20-10-31-10S18 29 9 36z" fill="#fff" opacity="0.28"/>' +
      '<circle cx="40" cy="40" r="29" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.55"/>' +
      '<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">' +
      '<path d="' + mark + '" stroke="#003477" opacity="0.35" transform="translate(0 3)"/>' +
      '<path d="' + mark + '" stroke="#fff"/>' +
      (eyes ? '<path d="' + eyes + '" stroke="#003477" opacity="0.35" transform="translate(0 3)" stroke-width="10"/><path d="' + eyes + '" stroke="#fff" stroke-width="10"/>' : "") +
      "</g></svg>";
  }
  const EYES = "M30 31v2M50 31v2";
  const BADGE = {
    check: badge("M24 41l11 11 22-25"), cross: badge("M27 27l26 26M53 27L27 53"),
    happy: badge("M26 46c7 10 21 10 28 0", EYES), meh: badge("M28 51h24", EYES), sad: badge("M26 56c7-9 21-9 28 0", EYES),
  };

  function attr(el, name) {
    return el.getAttribute("data-" + name) ?? el.getAttribute(name) ?? "";
  }

  function choicesFor(el) {
    const type = attr(el, "type").toLowerCase() || "choice";
    if (type === "smileys" || type === "smiley") {
      return [
        { key: "happy", label: "Got it", color: "#14d7cd", text: NAVY, icon: FACE.happy, badge: BADGE.happy },
        { key: "meh", label: "Sort of", color: "#fbc400", text: NAVY, icon: FACE.meh, badge: BADGE.meh },
        { key: "sad", label: "Not yet", color: "#ff8c0f", text: NAVY, icon: FACE.sad, badge: BADGE.sad },
      ];
    }
    if (type === "truefalse" || type === "true-false" || type === "tf") {
      return [
        { key: "true", label: "True", color: "#14d7cd", text: NAVY, icon: FACE.check, badge: BADGE.check },
        { key: "false", label: "False", color: "#ff8c0f", text: NAVY, icon: FACE.cross, badge: BADGE.cross },
      ];
    }
    let opts = attr(el, "options").split("|").map(s => s.trim()).filter(Boolean).map(label => ({ label }));
    // or a list in the poll, one answer per line, each with a picture if you like
    const list = el.querySelector(":scope > ul");
    if (!opts.length && list) {
      opts = Array.from(list.children).map(function (li) {
        const img = li.querySelector("img"), copy = li.cloneNode(true);
        copy.querySelectorAll("img").forEach(x => x.remove());
        return { label: copy.innerHTML.trim(), pic: img ? (img.getAttribute("src") || img.getAttribute("data-src") || "") : "" };   // reveal.js lazy-loads: data-src
      });
      list.remove();
    }
    return opts.slice(0, 6).map((o, i) => {
      const letter = String.fromCharCode(65 + i);
      return { key: letter, label: o.label, pic: o.pic, color: COLORS[i].c, text: COLORS[i].t, icon: '<span class="poll-letter">' + letter + "</span>" };
    });
  }

  function blip(freq) {
    try {
      const ctx = blip.ctx || (blip.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(freq, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq * 1.5, ctx.currentTime + 0.08);
      g.gain.setValueAtTime(0.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.2);
    } catch (e) { /* no sound available */ }
  }

  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)) || null; } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private window */ }
  }

  const controllers = [];

  // --- Results summary: every poll in the deck on one slide ----------------
  const summaries = document.querySelectorAll(".poll-summary");
  function renderSummaries() {
    if (!summaries.length || !controllers.length) return;
    const stamp = new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    const deck = (document.querySelector("#title-slide .title") || {}).textContent || document.title;
    summaries.forEach(function (box) {
      let html = '<div class="poll-sum-head"><strong>' + deck + '</strong><span>' + stamp + "</span></div>";
      html += '<div class="poll-sum-grid">';
      controllers.forEach(function (c) {
        const n = c.sum(), pcts = c.percents(n), counts = c.counts();
        html += '<div class="poll-sum-card">';
        if (c.title()) html += '<div class="poll-sum-title">' + c.title() + "</div>";
        html += '<div class="poll-sum-q">' + c.question() + "</div>";
        c.choices.forEach(function (ch, i) {
          const right = i === c.correctIndex;
          html += '<div class="poll-sum-row' + (right ? " correct" : "") + '" style="--c:' + ch.color + '">' +
            '<span class="poll-sum-label">' + ch.label + (right ? " ✓" : "") + "</span>" +
            '<span class="poll-sum-track"><span class="poll-sum-bar" style="width:' + pcts[i] + '%"></span></span>' +
            '<span class="poll-sum-num">' + counts[ch.key] + " · " + pcts[i] + "%</span></div>";
        });
        html += '<div class="poll-sum-total">' + n + (n === 1 ? " vote" : " votes") + "</div></div>";
      });
      box.innerHTML = html + "</div>";
    });
  }
  if (window.Reveal) Reveal.on("slidechanged", renderSummaries);  // refresh the date/time stamp

  polls.forEach(function (el, index) {
    const choices = choicesFor(el);
    if (!choices.length) return;
    if (choices.some(c => c.badge)) el.classList.add("poll-cards");
    // choice: the answers big on their tiles; with pictures: picture cards with A, B, C
    else if (choices.some(c => c.pic)) el.classList.add("poll-pics");
    else el.classList.add("poll-big");
    const storeKey = "poll:" + window.location.pathname + ":" + index;
    const cooldown = Math.max(0, parseFloat(attr(el, "cooldown") || "1")) * 1000;
    const correctRaw = attr(el, "correct").trim().toLowerCase();
    const correctIndex = choices.findIndex(c => c.key.toLowerCase() === correctRaw || String(choices.indexOf(c) + 1) === correctRaw);

    let counts = load(storeKey) || {};
    choices.forEach(c => { counts[c.key] = counts[c.key] || 0; });
    let cooling = false;

    // Keep the question (the div's own content), then add the widget.
    const q = document.createElement("div");
    q.className = "poll-q";
    while (el.firstChild) q.appendChild(el.firstChild);
    el.appendChild(q);

    const buttons = document.createElement("div");
    buttons.className = "poll-buttons";
    const results = document.createElement("div");
    results.className = "poll-results";
    choices.forEach(function (c, i) {
      const b = document.createElement("button");
      b.className = "poll-btn";
      b.style.setProperty("--c", c.color);
      b.style.setProperty("--t", c.text || "#fff");
      b.setAttribute("aria-label", "Vote: " + c.label);
      if (c.badge) b.innerHTML = '<span class="poll-badge">' + c.badge + '</span><span class="poll-label">' + c.label + "</span>";
      else if (el.classList.contains("poll-pics")) b.innerHTML = '<span class="poll-tag">' + c.key + "</span>" +
        (c.pic ? '<img class="poll-pic" src="' + c.pic + '" alt="">' : '<span class="poll-pic"></span>') + '<span class="poll-label">' + c.label + "</span>";
      else {
        const words = c.label.replace(/<[^>]+>/g, "").trim();
        if (words.length > 4) b.dataset.long = words.length > 14 ? "2" : "1";
        b.innerHTML = '<span class="poll-face"><span class="poll-answer">' + c.label + "</span></span>";
      }
      b.addEventListener("click", function (e) { e.stopPropagation(); vote(i); });
      buttons.appendChild(b);

      const row = document.createElement("div");
      row.className = "poll-row" + (i === correctIndex ? " correct" : "");
      row.style.setProperty("--c", c.color);
      row.style.setProperty("--t", c.text || "#fff");
      row.innerHTML = '<span class="poll-face">' + (el.classList.contains("poll-big") ? "" : c.icon) + '</span>' +
        (c.pic ? '<img class="poll-row-pic" src="' + c.pic + '" alt="">' : "") +
        '<span class="poll-row-label">' + c.label + "</span>" +
        '<div class="poll-track"><div class="poll-bar"></div></div>' +
        '<span class="poll-num"></span>';
      results.appendChild(row);
    });
    el.appendChild(buttons);
    el.appendChild(results);

    const controls = document.createElement("div");
    controls.className = "poll-controls";
    controls.innerHTML = '<span class="poll-total"></span>' +
      '<button class="poll-show">Show results</button><button class="poll-reset">Reset</button>';
    el.appendChild(controls);
    const total = controls.querySelector(".poll-total");
    const showBtn = controls.querySelector(".poll-show");
    const resetBtn = controls.querySelector(".poll-reset");

    function sum() { return choices.reduce((n, c) => n + counts[c.key], 0); }

    // Whole-number percentages that always add up to 100 (largest remainder method).
    function percents(n) {
      if (!n) return choices.map(() => 0);
      const exact = choices.map(c => 100 * counts[c.key] / n);
      const pct = exact.map(Math.floor);
      let left = 100 - pct.reduce((a, b) => a + b, 0);
      exact.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0])
        .slice(0, left).forEach(([, i]) => { pct[i] += 1; });
      return pct;
    }

    function paint() {
      renderSummaries();
      const n = sum();
      total.textContent = n + (n === 1 ? " vote" : " votes");
      const revealed = el.classList.contains("revealed");
      showBtn.textContent = revealed ? "Back to voting" : "Show results";
      el.classList.toggle("has-correct", revealed && correctIndex >= 0);
      const pcts = percents(n);
      results.querySelectorAll(".poll-row").forEach(function (row, i) {
        const v = counts[choices[i].key];
        const pct = pcts[i];
        row.querySelector(".poll-num").textContent = v + " · " + pct + "%";
        row.querySelector(".poll-bar").style.width = revealed ? pct + "%" : "0";
      });
    }

    function vote(i) {
      if (cooling || el.classList.contains("revealed")) return;
      const c = choices[i];
      counts[c.key] += 1;
      save(storeKey, counts);
      blip(440 + i * 110);

      const b = buttons.children[i];
      b.classList.add("pop");
      setTimeout(() => b.classList.remove("pop"), 150);
      const plus = document.createElement("span");
      plus.className = "poll-plus";
      plus.textContent = "+1";
      b.appendChild(plus);
      setTimeout(() => plus.remove(), 800);

      if (cooldown) {
        cooling = true;
        el.classList.add("cooling");
        setTimeout(() => { cooling = false; el.classList.remove("cooling"); }, cooldown);
      }
      paint();
    }

    function toggleResults() {
      el.classList.toggle("revealed");
      // Let the bars start at 0, then grow.
      requestAnimationFrame(() => requestAnimationFrame(paint));
    }

    let resetArmed = null;
    function reset() {
      if (!resetArmed) {
        resetBtn.textContent = "Sure? Tap again";
        resetArmed = setTimeout(() => { resetArmed = null; resetBtn.textContent = "Reset"; }, 3000);
        return;
      }
      clearTimeout(resetArmed); resetArmed = null; resetBtn.textContent = "Reset";
      choices.forEach(c => { counts[c.key] = 0; });
      save(storeKey, counts);
      el.classList.remove("revealed");
      paint();
    }

    // The toolbox's "Reset for the next class": votes back to 0, no "Sure?" needed.
    document.addEventListener("chalkline:reset", function (e) {
      if (!e.detail || !e.detail.polls) return;
      choices.forEach(c => { counts[c.key] = 0; });
      save(storeKey, counts);
      el.classList.remove("revealed");
      paint();
      renderSummaries();
    });

    showBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleResults(); });
    resetBtn.addEventListener("click", function (e) { e.stopPropagation(); reset(); });
    if (isPreview) controls.style.visibility = "hidden";
    paint();

    controllers.push({
      el, vote, toggleResults, choices, correctIndex, percents, sum,
      counts: () => counts,
      question: () => q.innerHTML,
      title: () => { const h = el.closest("section")?.querySelector("h2"); return h ? h.textContent.trim() : ""; },
    });
  });

  renderSummaries();  // now that every poll is set up

  // --- Star survey ----------------------------------------------------------
  const STAR = '<svg viewBox="0 0 40 40" aria-hidden="true"><path class="ss-fill" d="M20 3.5l5.1 10.4 11.4 1.7-8.3 8.1 2 11.4L20 29.7 9.8 35.1l2-11.4-8.3-8.1 11.4-1.7z"/></svg>';
  const SEG = ["#ff8c0f", "#fbc400", "#14d7cd", "#2e9e4f", "#0087ff", "#003477"];
  function chord() {
    try {
      const ctx = blip.ctx || (blip.ctx = new (window.AudioContext || window.webkitAudioContext)());
      [523.25, 659.25, 783.99].forEach(function (f, i) {
        const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.09;
        o.type = "triangle"; o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.4);
      });
    } catch (e) { /* no sound available */ }
  }
  document.querySelectorAll(".star-survey").forEach(function (el, index) {
    const items = Array.from(el.querySelectorAll(":scope > ul > li")).map(li => li.innerHTML);
    if (!items.length) return;
    const n = Math.min(6, Math.max(2, parseInt(attr(el, "stars"), 10) || 4));
    const key = "star-survey:" + window.location.pathname + ":" + index;
    let answers = load(key) || [];   // one array of ratings per student
    let current = items.map(() => 0), busy = false;

    const form = document.createElement("div"); form.className = "ss-form";
    const thanks = document.createElement("div"); thanks.className = "ss-thanks"; thanks.textContent = "Thank you! 谢谢！";
    const results = document.createElement("div"); results.className = "ss-results";
    const rows = items.map(function (html, r) {
      const row = document.createElement("div"); row.className = "ss-row";
      const label = document.createElement("div"); label.className = "ss-label"; label.innerHTML = html;
      const stars = document.createElement("div"); stars.className = "ss-stars";
      const btns = [];
      for (let s = 1; s <= n; s++) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "ss-star"; b.innerHTML = STAR;
        b.setAttribute("aria-label", s + (s === 1 ? " star" : " stars"));
        b.addEventListener("click", function (e) { e.stopPropagation(); rate(r, s); });
        btns.push(b); stars.appendChild(b);
      }
      row.append(label, stars); form.appendChild(row);
      return { row, btns };
    });
    const controls = document.createElement("div"); controls.className = "ss-controls";
    controls.innerHTML = '<span class="ss-total"></span><button class="ss-show-btn">Show results</button><button class="ss-reset">Reset</button>';
    el.append(form, thanks, results, controls);

    function paintStars() {
      rows.forEach(function (o, r) {
        o.btns.forEach(function (b, i) { b.classList.toggle("ss-on", i < current[r]); });
        o.row.classList.toggle("ss-done", current[r] > 0);
      });
      const t = answers.length;
      controls.querySelector(".ss-total").textContent = t + (t === 1 ? " response" : " responses");
    }
    function rate(r, s) {
      if (busy || el.classList.contains("ss-revealed")) return;
      current[r] = s; blip(330 + s * 70); paintStars();
      if (current.every(v => v > 0)) {   // this student is done: save, thank, fade, clear
        busy = true;
        answers.push(current.slice()); save(key, answers);
        setTimeout(function () { chord(); thanks.classList.add("ss-show"); form.classList.add("ss-fade"); }, 250);
        setTimeout(function () {
          current = items.map(() => 0); paintStars();
          thanks.classList.remove("ss-show"); form.classList.remove("ss-fade"); busy = false;
        }, 1700);
      }
    }
    function paintResults() {
      let html = "";
      items.forEach(function (label, r) {
        const counts = Array(n).fill(0); let sum = 0;
        answers.forEach(a => { if (a[r]) { counts[a[r] - 1]++; sum += a[r]; } });
        const t = answers.length, avg = t ? (sum / t).toFixed(1) : "–";
        html += '<div class="ss-res-row"><div class="ss-res-label">' + label + '</div><div class="ss-bars">' +
          counts.map((c, i) => c ? '<span class="ss-seg" style="flex-grow:' + c + ';background:' + SEG[i] + '">' + c + "</span>" : "").join("") +
          '</div><div class="ss-avg">' + avg + " ★</div></div>";
      });
      html += '<div class="ss-key">' + Array.from({ length: n }, (_, i) => '<span style="--c:' + SEG[i] + '">' + (i + 1) + " ★</span>").join("") + "</div>";
      results.innerHTML = html;
    }
    controls.querySelector(".ss-show-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      el.classList.toggle("ss-revealed");
      this.textContent = el.classList.contains("ss-revealed") ? "Back to the survey" : "Show results";
      paintResults();
    });
    controls.querySelector(".ss-reset").addEventListener("click", function (e) {
      e.stopPropagation();
      if (!confirm("Clear all " + answers.length + " responses?")) return;
      answers = []; save(key, answers); current = items.map(() => 0); paintStars(); paintResults();
    });
    if (isPreview) controls.style.visibility = "hidden";
    paintStars();
  });

  // Keyboard shortcuts, only on a slide that has a poll.
  function currentPoll() {
    if (!window.Reveal || !Reveal.getCurrentSlide) return null;
    const slide = Reveal.getCurrentSlide();
    return controllers.find(c => slide && slide.contains(c.el)) || null;
  }
  if (window.Reveal && !isPreview) {
    Reveal.addKeyBinding({ keyCode: 82, key: "R", description: "Poll: show/hide results" }, function () {
      const p = currentPoll(); if (p) p.toggleResults();
    });
    for (let n = 1; n <= 6; n++) {
      const onKey = function () {
        const p = currentPoll(); if (p && n <= p.choices.length) p.vote(n - 1);
      };
      // Only key 1 gets a line in the "?" help screen.
      if (n === 1) Reveal.addKeyBinding({ keyCode: 49, key: "1–6", description: "Poll: add a vote" }, onKey);
      else Reveal.addKeyBinding(48 + n, onKey);
    }
  }
})();
</script>
