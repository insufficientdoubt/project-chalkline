<!--
  Column labels in the slide overview (press O or Esc): above each column of slides, a label naming it,
  so a 2D deck (a column per lesson phase, say) reads like a table. The label is, in order:
    - data-column-label="Practice" on the column's first slide:  # Title {data-column-label="Practice"}
    - the phase in its first slide's footer (.phase, as in the exemplar deck)
    - its menu title (data-menu-title=), or its title
  And a faint line between the columns, as tall as the longest column, with more room between the
  columns than reveal.js leaves (GAP), and the selected slide outlined.
  Zoom: reveal.js draws the overview at a fixed size (each slide 1/5 of the screen). Here it starts
  bigger (OVERVIEW_ZOOM), and + and − change it while the overview is open (remembered in this browser).
  Enter opens the selected slide (reveal.js itself only closes the overview with O, Esc or a click).
  Only in a deck with columns (stacks of slides); a flat deck gets neither.
  Added to every deck by filter.lua; turn off with `overview-labels: false`.
-->
<style>
  .reveal .slides > section > .ov-label { display: none; }
  .reveal.overview .slides > section > .ov-label {
    display: block; position: absolute; left: 0; right: 0; bottom: calc(100% + 34px); z-index: 5;
    padding: 22px 28px; border-radius: 26px; text-align: center; transform: none;
    background: var(--strong, #003477); color: var(--on-strong, #fff);
    font: 700 96px/1.12 var(--r-heading-font, "Source Sans 3", sans-serif); letter-spacing: 0.01em;
    white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    pointer-events: none;
  }
  .reveal.overview .slides > section:not(.stack):has(> .ov-label, > .ov-line) { overflow: visible; }
  /* the line between columns: in the 70px reveal.js leaves between them, from the label to the longest column's end */
  .reveal .slides > section > .ov-line { display: none; }
  .reveal.overview .slides > section > .ov-line {
    display: block; position: absolute; top: -330px; right: calc(-35px - var(--ov-gap, 0px) / 2 - 5px); width: 10px; border-radius: 5px; pointer-events: none;
    height: calc(var(--ov-rows, 1) * (100% + 70px) + 260px);
    background: var(--ink, #1f2933); opacity: 0.22;
  }   /* a one-slide column: its label sits above it */
  .reveal.overview .slides > section.present > .ov-label { background: var(--accent, #14d7cd); color: var(--on-accent, #003477); }
  .reveal.overview .slides > section > .ov-label .ov-zh { display: block; font-size: 0.7em; font-weight: 600; opacity: 0.85; }
  html.print-pdf .ov-label { display: none !important; }
  /* the selected slide: a thick outline in the scheme's accent and a glow; the others a little faded */
  .reveal.overview .slides section:not(.stack) { transition: opacity 0.2s; }
  .reveal.overview .slides section:not(.stack):not(.present) { opacity: 0.6 !important; }
  .reveal.overview .slides section:not(.stack):not(.present):hover { opacity: 1 !important; }
  .reveal.overview .slides section:not(.stack).present {
    opacity: 1 !important; outline: 26px solid var(--hot, #ff8c0f); outline-offset: 16px; border-radius: 6px;
    box-shadow: 0 0 0 16px var(--paper, #fff), 0 0 120px 60px color-mix(in srgb, var(--hot, #ff8c0f) 40%, transparent);
  }
</style>
<script>
(function () {
  if (!window.Reveal || /[?&](receiver|print-pdf)/.test(location.search)) return;
  function text(el) { return el ? el.textContent.replace(/\s+/g, " ").trim() : ""; }
  function labelFor(col) {
    const first = col.classList.contains("stack") ? col.querySelector(":scope > section") : col;
    if (!first) return null;
    const own = first.getAttribute("data-column-label") || col.getAttribute("data-column-label");
    if (own) return { en: own };
    const phase = first.querySelector(".footer .phase");
    if (phase) {
      const parts = text(phase).split(" · ");   // "1 · Lesson intro · 课堂导入": the 中文 on its own line
      const last = parts[parts.length - 1];
      if (parts.length > 1 && /[㐀-鿿]/.test(last)) return { en: parts.slice(0, -1).join(" · "), zh: last };
      return { en: text(phase) };
    }
    const menu = first.getAttribute("data-menu-title");
    if (menu) return { en: menu.split(":")[0] };
    const h = first.querySelector("h1, h2");
    const en = h && (h.querySelector(".bil-en") || h);
    return en ? { en: text(en) } : null;
  }
  function start() {
    const cols = Reveal.getHorizontalSlides();
    const anyStack = cols.some(function (c) { return c.classList.contains("stack"); });
    if (!anyStack) return;   // a flat deck: nothing to group
    // as many rows as the longest column, for the lines' length
    const rows = Math.max.apply(null, cols.map(function (c) { return c.classList.contains("stack") ? c.querySelectorAll(":scope > section").length : 1; }));
    document.querySelector(".reveal").style.setProperty("--ov-rows", rows);
    cols.forEach(function (col, i) {
      if (i < cols.length - 1 && !col.querySelector(":scope > .ov-line")) {
        const line = document.createElement("div");
        line.className = "ov-line"; line.setAttribute("aria-hidden", "true");
        col.append(line);
      }
      if (col.id === "title-slide" || col.querySelector(":scope > .ov-label")) return;
      const l = labelFor(col);
      if (!l || !l.en) return;
      const div = document.createElement("div");
      div.className = "ov-label";
      div.setAttribute("aria-hidden", "true");
      div.textContent = l.en;
      if (l.zh) { const z = document.createElement("span"); z.className = "ov-zh"; z.textContent = l.zh; div.append(z); }
      col.prepend(div);
    });
  }
  if (Reveal.isReady()) start(); else Reveal.on("ready", start);

  // ---- Spacing: reveal.js puts the columns 70px apart; GAP more between them ----
  const GAP = 180;
  document.querySelector(".reveal").style.setProperty("--ov-gap", GAP + "px");
  function space(t) {
    const W = Reveal.getConfig().width + 70, cols = Reveal.getHorizontalSlides();
    cols.forEach(function (c, i) { c.style.transform = "translate3d(" + i * (W + GAP) + "px, 0, 0)"; });
    document.querySelectorAll(".reveal .backgrounds > .slide-background").forEach(function (b, i) {
      b.style.transform = "translate3d(" + i * (W + GAP) + "px, 0, 0)";
    });
    const h = Reveal.getIndices().h;
    return t.replace(/translateX\(-?[\d.]+px\)/, "translateX(" + (-h * (W + GAP)) + "px)");
  }

  // ---- Zoom: reveal.js sets the overview's scale itself; this multiplies it ----
  const KEY = "chalkline-overview-zoom", OVERVIEW_ZOOM = 1.4;
  let zoom = OVERVIEW_ZOOM;
  try { zoom = parseFloat(localStorage.getItem(KEY)) || OVERVIEW_ZOOM; } catch (e) { /* private window */ }
  function applyZoom() {
    if (!Reveal.isOverview()) return;
    const slides = document.querySelector(".reveal .slides");
    const t = slides.style.transform || "";
    const all = t.match(/scale\([\d.]+\)/g);   // the slide size's scale, then the overview's: change the last
    if (!all) return;
    const last = all[all.length - 1], m = last.match(/([\d.]+)/), at = t.lastIndexOf(last);
    if (!slides.dataset.ovBase || Math.abs(parseFloat(slides.dataset.ovSet) - parseFloat(m[1])) > 1e-6) slides.dataset.ovBase = m[1];
    const scale = parseFloat(slides.dataset.ovBase) * zoom;
    slides.dataset.ovSet = String(scale);
    slides.style.transform = space(t.slice(0, at) + "scale(" + scale + ")" + t.slice(at + last.length));
  }
  function later() { requestAnimationFrame(applyZoom); }
  ["overviewshown", "slidechanged", "resize"].forEach(function (ev) { Reveal.on(ev, later); });
  window.addEventListener("resize", function () { setTimeout(later, 50); });
  document.addEventListener("keydown", function (e) {
    if (!Reveal.isOverview() || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Enter" && !(e.target && e.target.closest && e.target.closest("input, textarea, button, a, select"))) {
      e.preventDefault(); e.stopPropagation(); Reveal.toggleOverview(false); return;   // open the selected slide (reveal.js has no key for it)
    }
    let z = null;
    if (e.key === "+" || e.key === "=") z = Math.min(3, zoom * 1.2);
    if (e.key === "-" || e.key === "_") z = Math.max(0.5, zoom / 1.2);
    if (z === null) return;
    e.preventDefault(); e.stopPropagation();
    zoom = z;
    try { localStorage.setItem(KEY, String(zoom)); } catch (err) { /* private window */ }
    applyZoom();
  }, true);
})();
</script>
